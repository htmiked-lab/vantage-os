<!--
  Tiipikids Trust Badge Bar
  Embeddable HTML/CSS snippet

  Usage options:
    1) Paste directly into a product description via Shopify's HTML source editor.
    2) Add as a custom Liquid section — wrap in <div class="tk-trust-bar"> ... </div>
       and drop into sections/ (the CSS is self-contained via <style>).
    3) Use in a blog post or page for brand reinforcement.

  Palette:
    --tk-green-deep: #3F5D4A   (primary accent)
    --tk-green-soft: #EDF2EE   (badge background)
    --tk-neutral:    #4A4A47   (text)
    --tk-bg:         #FAFAF7   (bar background)

  Notes:
    - Fully self-contained. Styles are scoped with .tk-trust-bar to avoid
      collisions with the surrounding theme.
    - Mobile: 2x2 grid. Tablet/desktop: single row of 4.
    - No external fonts, no JS, no images — inline SVG icons only.
-->

<style>
  .tk-trust-bar {
    --tk-green-deep: #3F5D4A;
    --tk-green-soft: #EDF2EE;
    --tk-neutral: #4A4A47;
    --tk-bg: #FAFAF7;
    --tk-border: #E3E8E4;

    box-sizing: border-box;
    width: 100%;
    margin: 24px 0;
    padding: 20px 16px;
    background: var(--tk-bg);
    border-top: 1px solid var(--tk-border);
    border-bottom: 1px solid var(--tk-border);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    color: var(--tk-neutral);
  }

  .tk-trust-bar *,
  .tk-trust-bar *::before,
  .tk-trust-bar *::after {
    box-sizing: border-box;
  }

  .tk-trust-bar__inner {
    max-width: 1100px;
    margin: 0 auto;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px 12px;
  }

  .tk-trust-bar__item {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px 10px;
    background: var(--tk-green-soft);
    border-radius: 10px;
    text-align: left;
  }

  .tk-trust-bar__icon {
    flex: 0 0 auto;
    width: 28px;
    height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--tk-green-deep);
  }

  .tk-trust-bar__icon svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  .tk-trust-bar__label {
    font-size: 13px;
    line-height: 1.25;
    font-weight: 600;
    letter-spacing: 0.01em;
    color: var(--tk-green-deep);
  }

  @media (min-width: 640px) {
    .tk-trust-bar {
      padding: 24px 20px;
    }
    .tk-trust-bar__inner {
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }
    .tk-trust-bar__label {
      font-size: 14px;
    }
  }

  @media (min-width: 1024px) {
    .tk-trust-bar__item {
      padding: 14px 16px;
    }
    .tk-trust-bar__label {
      font-size: 15px;
    }
    .tk-trust-bar__icon {
      width: 32px;
      height: 32px;
    }
  }
</style>

<div class="tk-trust-bar" role="complementary" aria-label="Brand trust highlights">
  <div class="tk-trust-bar__inner">

    <div class="tk-trust-bar__item">
      <span class="tk-trust-bar__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L4 6v6c0 5 3.5 9 8 10 4.5-1 8-5 8-10V6l-8-4z"/>
          <path d="M9 12l2 2 4-4"/>
        </svg>
      </span>
      <span class="tk-trust-bar__label">BPA-Free</span>
    </div>

    <div class="tk-trust-bar__item">
      <span class="tk-trust-bar__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 21s-7-4.5-7-11a5 5 0 0 1 9-3 5 5 0 0 1 9 3c0 6.5-7 11-7 11h-4z"/>
          <path d="M8 10l2 2 4-4"/>
        </svg>
      </span>
      <span class="tk-trust-bar__label">Non-Toxic</span>
    </div>

    <div class="tk-trust-bar__item">
      <span class="tk-trust-bar__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="5"/>
          <path d="M8.5 13L7 22l5-3 5 3-1.5-9"/>
        </svg>
      </span>
      <span class="tk-trust-bar__label">25,000+ Sold</span>
    </div>

    <div class="tk-trust-bar__item">
      <span class="tk-trust-bar__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="8" r="3.5"/>
          <circle cx="17" cy="9" r="2.5"/>
          <path d="M3 20c0-3 3-5 6-5s6 2 6 5"/>
          <path d="M15 20c0-2 2-4 4-4s2.5 1.5 2.5 4"/>
        </svg>
      </span>
      <span class="tk-trust-bar__label">Designed by Parents</span>
    </div>

  </div>
</div>
